{% extends "base.html" %}

{% block title %}Log in | Card Collector{% endblock %}
{% block header_meta %}Log in{% endblock %}

{% block content %}
    <p class="eyebrow">Welcome back</p>
    <h1 class="page-title">Log in</h1>

    <form method="post" class="auth-form" style="max-width: 26rem; margin-top: 1.5rem;">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button button-primary" type="submit">Log in</button>
    </form>
{% endblock %}
