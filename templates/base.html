{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Card Collector{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/prototype.css' %}">
</head>
<body>
    <div class="page-glow glow-one" aria-hidden="true"></div>
    <div class="page-glow glow-two" aria-hidden="true"></div>

    <header class="site-header">
        <a class="wordmark" href="{% url 'home' %}">
            <span class="wordmark-mark">CC</span>
            Card Collector
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="{% url 'pack_list' %}">Packs</a>
            {% if user.is_authenticated %}
                <a href="{% url 'collection' %}">Collection</a>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'signup' %}">Sign up</a>
                <a class="site-nav-accent" href="{% url 'login' %}">Log in</a>
            {% endif %}
        </nav>
    </header>

    <main class="game-page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
