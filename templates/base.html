{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Card Collector{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/prototype.css' %}">
</head>
<body>
    <div class="page-glow glow-one" aria-hidden="true"></div>
    <div class="page-glow glow-two" aria-hidden="true"></div>

    <header class="site-header">
        <a class="wordmark" href="{% url 'home' %}">
            <span class="wordmark-mark">CC</span>
            Card Collector
        </a>
        <p class="pack-meta">{% block header_meta %}Collector{% endblock %}</p>
    </header>

    <main class="game-page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
