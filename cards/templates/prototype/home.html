<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Card Collector</title>
</head>

<body>
    <h1>Card Collector</h1>

    <p>
        Open a pack and receive five random cards.
    </p>

    <form
        action="{% url 'open_pack' %}"
        method="post"
    >
        {% csrf_token %}

        <button type="submit">
            Open Pack
        </button>
    </form>

    <p>
        <a href="{% url 'collection' %}">
            View Collection
        </a>
    </p>
</body>
</html>
